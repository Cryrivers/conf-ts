  - '@vitest/spy@4.1.10'
  - '@vitest/ui@4.1.10'
  - '@vitest/utils@4.1.10'
  - vitest@4.1.10
  - tsdown@0.22.4 || 0.22.7
  - rolldown-plugin-dts@0.27.8
  - tsx@4.23.1
  - '@turbo/darwin-64@2.10.6'
  - '@turbo/darwin-arm64@2.10.6'
  - '@turbo/linux-64@2.10.6'
  - '@turbo/linux-arm64@2.10.6'
